name: pip-audit

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"
      - name: Install uv and pip-audit (pinned)
        run: pip install uv "pip-audit==2.10.1"
      - name: Export locked dependencies and audit
        run: |
          uv export --format requirements-txt --no-hashes -o /tmp/requirements.lock.txt
          pip-audit -r /tmp/requirements.lock.txt
